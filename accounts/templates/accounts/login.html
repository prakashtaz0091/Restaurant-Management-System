
{% extends "base.html" %}
{% block title %}Login | YAKHotel{% endblock title %}
{% block content %}

<div class="min-h-[calc(100vh-80px)] bg-gray-50 flex items-center justify-center px-4 py-12">

    <div class="w-full max-w-md">

        <!-- Login Card -->
        <div class="bg-white border border-gray-200 shadow-sm rounded-2xl p-8 sm:p-10">

            <!-- Logo -->
            <div class="flex items-center justify-center gap-2 mb-8">
                <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center">
                    <span class="text-white font-bold text-xl">L</span>
                </div>

                <span class="text-2xl font-bold text-gray-800">
                    YAK<span class="text-blue-600">Hotel</span>
                </span>
            </div>

            <!-- Heading -->
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-gray-800">
                    Welcome Back!
                </h1>

                <p class="text-sm text-gray-500 mt-2">
                    Please login to your account
                </p>
            </div>

            <!-- Login Form -->
            <form method="POST" action="{% url 'login-page' %}" class="space-y-5">

                {% csrf_token %}

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                        text-sm text-gray-800 placeholder-gray-400
                        focus:outline-none focus:ring-2 focus:ring-blue-500
                        focus:border-blue-500 transition"
                    />
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                        Password
                    </label>

                    <div class="relative">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                            class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg
                            text-sm text-gray-800 placeholder-gray-400
                            focus:outline-none focus:ring-2 focus:ring-blue-500
                            focus:border-blue-500 transition"
                        />

                        <!-- Eye Toggle -->
                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute right-3 top-1/2 -translate-y-1/2
                            text-gray-400 hover:text-blue-600 transition"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <!-- Eye Icon -->
                            <svg id="eyeIcon"
                                xmlns="http://www.w3.org/2000/svg"
                                class="w-5 h-5"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="1.8">

                                <path stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M2.25 12s3.5-7 9.75-7
                                    9.75 7 9.75 7-3.5 7-9.75 7
                                    S2.25 12 2.25 12z"/>

                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>

                    </div>
                </div>

                <!-- Forgot Password -->
                <div class="flex justify-end">
                    <a href=""
                        class="text-sm font-medium text-blue-600 hover:text-blue-700 transition">
                        Forgot Password?
                    </a>
                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700
                    text-white font-semibold py-3 rounded-lg
                    transition duration-200 shadow-sm">

                    Login

                </button>

            </form>

            <!-- Signup -->
            <div class="mt-8 text-center">
                <p class="text-sm text-gray-500">
                    Don't have an account?

                    <a href="{% url 'signup-page' %}"
                        class="font-semibold text-blue-600 hover:text-blue-700 transition">
                        Sign Up
                    </a>
                </p>
            </div>

        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-gray-400 mt-6">
            &copy; {% now "Y" %} YAKHotel. All rights reserved.
        </p>

    </div>

</div>

<!-- Password Toggle Script -->
<script>
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");

    togglePassword.addEventListener("click", function () {

        const isPassword = passwordInput.type === "password";

        passwordInput.type = isPassword ? "text" : "password";

        this.setAttribute("aria-pressed", String(isPassword));

        this.setAttribute(
            "aria-label",
            isPassword ? "Hide password" : "Show password"
        );

        // Toggle eye icon
        this.innerHTML = isPassword
            ? `<svg xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5" fill="none"
                viewBox="0 0 24 24" stroke="currentColor"
                stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8
                M9.9 5.2A10.7 10.7 0 0112 5
                c6.25 0 9.75 7 9.75 7a16.8 16.8 0 01-4.1 4.8
                M6.2 6.2C3.7 7.8 2.25 12 2.25 12
                s3.5 7 9.75 7c.9 0 1.7-.15 2.5-.4"/>
                </svg>`
            : `<svg xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5" fill="none"
                viewBox="0 0 24 24" stroke="currentColor"
                stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.25 12s3.5-7 9.75-7 9.75 7 9.75 7
                -3.5 7-9.75 7S2.25 12 2.25 12z"/>
                <circle cx="12" cy="12" r="3"/>
                </svg>`;
    });
</script>

{% endblock %}
