services:
  db:
    container_name: prod-db
    image: postgres:16-alpine
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rms_project"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: prod-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rustfs:
    image: rustfs/rustfs:latest
    container_name: prod-rustfs
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Admin UI (if supported)
    volumes:
      - rustfs_data:/data

  web:
    build: .
    env_file:
      - .env.production
    container_name: prod-web
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py create_tables &&
      python manage.py create_basic_menuitems &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
      "
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - rustfs

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - web
      - rustfs
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  worker:
    container_name: prod-worker
    build: .
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    env_file:
      - .env.production

  beat:
    container_name: prod-beat
    build: .
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env.production

volumes:
  postgres_data:
  rustfs_data: